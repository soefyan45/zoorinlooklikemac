# Settings of zoorin-fan-boost: /etc/zoorin-fan-boost/fan.conf, owned by the desktop user.
# Zoorinlooklikemac's preferences (Notch > Fan, Power) write this file; changes apply within seconds.
# Off until turned on in the preferences
ENABLED=0
ON=75
OFF=68
INTERVAL=2
# CPU limits: percent of the top speed, Turbo Boost, energy preference (auto = power profile)
CPU_MAX=100
TURBO=1
EPP=auto
