[package]
name = "zorin-notchd"
version = "0.2.0"
edition = "2024"
description = "Daemon and agent hooks for Zorin Notch"
license = "MIT"
repository = "https://github.com/soefyan45/zoorinlooklikemac"

[dependencies]
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "rt", "sync", "time"] }
zbus = { version = "6.1.0", default-features = false, features = ["tokio", "service"] }

[profile.release]
# Hooks run on every tool call of an agent: keep the binary small and quick to start
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
